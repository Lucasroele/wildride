<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Afterimage typographic cover</title>
  <rect width="1600" height="1200" fill="#f4f1eb"/>
  <rect x="88" y="88" width="1424" height="1024" fill="none" stroke="rgb(170,170,170)" stroke-width="2" opacity="0.35"/>
  <line x1="88" y1="782" x2="1512" y2="782" stroke="rgb(170,170,170)" stroke-width="2" opacity="0.22"/>
  <text x="140" y="255" fill="rgb(170,170,170)" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" letter-spacing="0.02em">Afterimage</text>
  <text x="142" y="382" fill="rgb(170,170,170)" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="0.18em">Screen study</text>
  <text x="140" y="980" fill="rgb(170,170,170)" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="0.12em">
    <tspan x="140" dy="0">Two colours sharing a surface.</tspan>
    <tspan x="140" dy="62">The overlap becomes a third thing.</tspan>
  </text>
</svg>
