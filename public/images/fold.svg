<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Fold typographic cover</title>
  <rect width="1600" height="1200" fill="#f5f1e8"/>
  <rect x="88" y="88" width="1424" height="1024" fill="none" stroke="rgb(170,170,170)" stroke-width="2" opacity="0.35"/>
  <line x1="88" y1="456" x2="1512" y2="456" stroke="rgb(170,170,170)" stroke-width="2" opacity="0.2"/>
  <text x="140" y="252" fill="rgb(170,170,170)" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" letter-spacing="0.02em">Fold</text>
  <text x="142" y="378" fill="rgb(170,170,170)" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="0.18em">Paper study</text>
  <text x="140" y="988" fill="rgb(170,170,170)" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="0.12em">
