<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Notations typographic cover</title>
  <rect width="1600" height="1200" fill="#f6f2e4"/>
  <rect x="88" y="88" width="1424" height="1024" fill="none" stroke="rgb(170,170,170)" stroke-width="2" opacity="0.35"/>
  <line x1="88" y1="432" x2="1512" y2="432" stroke="rgb(170,170,170)" stroke-width="2" opacity="0.2"/>
  <text x="140" y="250" fill="rgb(170,170,170)" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" letter-spacing="0.02em">Notations</text>
  <text x="142" y="378" fill="rgb(170,170,170)" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="0.18em">Drawing exercise</text>
  <text x="140" y="984" fill="rgb(170,170,170)" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="0.12em">
    <tspan x="140" dy="0">Marks for something heard, not seen.</tspan>
    <tspan x="140" dy="62">No key, and no correct way to read them.</tspan>
  </text>
</svg>
